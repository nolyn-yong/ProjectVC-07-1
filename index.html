<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#222222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>幼兒園拍照防漏拍 Pro (IndexedDB & 家長分享版)</title>

<!-- Dexie.js for IndexedDB -->
<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
<!-- AI Face API Library -->
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<!-- 動態產生的 PWA Manifest -->
<script>
  const manifest = {
    "name": "幼兒園拍照防漏拍 Pro",
    "short_name": "防漏拍IndexedDB",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#f6f7fb",
    "theme_color": "#222222",
    "icons": [{
      "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>",
      "sizes": "192x192",
      "type": "image/svg+xml"
    }]
  };
  const stringManifest = JSON.stringify(manifest);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
</script>

<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    background: #f6f7fb; color: #222; padding-bottom: 80px;
  }
  .app { max-width: 760px; margin: auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: #666; margin-bottom: 14px; font-size: 13px; }
  
  .card {
    background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
  }
  .top { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 15px; outline: none; background: white;
  }
  .field { flex: 1; min-width: 140px; }
  
  button {
    border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px;
    cursor: pointer; background: #222; color: white; font-weight: 500;
  }
  button.secondary { background: #eee; color: #222; }
  button.share-btn { background: #10b981; color: white; font-weight: bold; }
  button.danger { background: #ffe9e9; color: #b42318; }
  button.camera-btn {
    background: #2563eb; color: white; font-weight: bold; width: 100%;
    padding: 14px; font-size: 16px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .stats { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .progress { height: 10px; background: #eee; border-radius: 99px; overflow: hidden; margin: 8px 0; }
  .bar { height: 100%; width: 0%; background: #222; transition: width .2s; }
  
  .filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .filters button.active { background: #222; color: white; }
  
  .student {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; border: 1px solid #eee; border-radius: 12px; margin: 8px 0;
    gap: 10px; background: #fff; transition: background .2s;
  }
  .student.alert-target { border-left: 5px solid #e53e3e; }
  .student.done { background: #f9fbf8; }
  
  .name { font-size: 16px; font-weight: 600; }
  .status { font-size: 12px; margin-top: 2px; color: #777; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 4px; }
  .badge-danger { background: #fed7d7; color: #9b2c2c; }
  .badge-warning { background: #feebc8; color: #9c4221; }
  .badge-success { background: #c6f6d5; color: #22543d; }
  .badge-ai { background: #e0e7ff; color: #3730a3; }
  
  .btn-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .empty { text-align: center; color: #777; padding: 20px; font-size: 14px; }
  .addrow { display: flex; gap: 8px; }
  .addrow input { flex: 1; }
  
  .photo-thumbs { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; border: 1px solid #ddd; }

  .ai-status { font-size: 12px; padding: 8px; border-radius: 8px; margin-bottom: 12px; text-align: center; }
  .ai-status.loading { background: #e0f2fe; color: #0369a1; }
  .ai-status.ready { background: #dcfce7; color: #15803d; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: white; border-radius: 20px 20px 0 0; padding: 20px;
    width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .assign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .assign-card {
    border: 2px solid #eee; border-radius: 12px; padding: 12px; text-align: center;
    cursor: pointer; background: #f9f9f9; transition: all 0.15s; position: relative;
  }
  .assign-card.ai-matched { border-color: #2563eb; background: #eff6ff; box-shadow: 0 0 10px rgba(37,99,235,0.2); }
  .assign-card:active { transform: scale(0.96); background: #ebf8ff; border-color: #3182ce; }
  .assign-card .count { font-size: 12px; color: #666; margin-top: 4px; }
  .ai-badge-top { position: absolute; top: -10px; right: 8px; background: #2563eb; color: white; font-size: 10px; padding: 2px 6px; border-radius: 99px; }

  @media (max-width: 520px) {
    .app { padding: 12px; }
    .student { flex-direction: column; align-items: flex-start; }
    .btn-group { width: 100%; justify-content: space-between; margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>📸 幼兒園拍照防漏拍 Pro (IndexedDB & 家長分享版)</h1>
  <div class="sub">使用 IndexedDB 海量圖庫儲存，支援離線、AI 人臉辨識與一鍵分享照片給家長。</div>

  <div id="aiStatus" class="ai-status loading">🤖 正在載入 AI 人臉辨識模型中...</div>

  <div class="card">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoCaptured(event)">
    <button class="camera-btn" onclick="triggerCamera()">
      📷 開啟相機拍攝並 AI 歸類
    </button>
  </div>

  <div class="card">
    <div class="top">
      <div class="field">
        <label>班級名稱</label>
        <input id="className" placeholder="例如：彩虹班" onchange="saveSettings()">
      </div>
      <div class="field" style="max-width: 120px;">
        <label>目標張數/人</label>
        <input id="targetPhotos" type="number" min="1" value="3" onchange="saveSettings()">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <strong id="progressText">已達標 0 / 0 人</strong>
      <span id="photoTotal">總張數：0 張</span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="stats" style="margin-top:4px;">
      <span>完成率：<span id="percent">0%</span></span>
      <span>平均：<span id="averagePhotos">0 張/人</span></span>
      <span>未達標：<strong id="underTargetCount" style="color:#e53e3e;">0 人</strong></span>
    </div>

    <div class="filters">
      <button id="allBtn" class="active" onclick="setFilter('all')">全部</button>
      <button id="todoBtn" class="secondary" onclick="setFilter('todo')">未拍攝 (0張)</button>
      <button id="underBtn" class="secondary" onclick="setFilter('under')">未達目標張數</button>
      <button id="doneBtn" class="secondary" onclick="setFilter('done')">已達標</button>
    </div>
  </div>

  <div class="card">
    <strong>新增學生與匯入名單</strong>
    <div class="addrow" style="margin-top:8px;">
      <input id="studentName" placeholder="輸入學生姓名">
      <button onclick="addStudent()">新增</button>
    </div>
    <div style="margin-top:10px;">
      <input type="file" id="csvFileInput" accept=".csv, .txt" style="display:none" onchange="importCSV(event)">
      <button class="secondary" style="width:100%;" onclick="document.getElementById('csvFileInput').click()">📥 批次匯入名單 (CSV/TXT)</button>
    </div>
  </div>

  <input type="file" id="enrollInput" accept="image/*" style="display:none" onchange="handleEnrollPhoto(event)">

  <div class="card">
    <div id="studentList"></div>
  </div>

  <div class="card" style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="secondary" onclick="resetToday()">↩ 今日重置照片</button>
    <button class="secondary" onclick="exportCSV()">📤 匯出記錄 (CSV)</button>
    <button class="danger" onclick="clearStudents()" style="margin-left:auto;">刪除名單</button>
  </div>
</div>

<div class="modal-overlay" id="assignModal">
  <div class="modal-content">
    <h3 style="margin-top:0; margin-bottom:4px;">🎯 這張照片是哪位小朋友的？</h3>
    <div style="font-size:12px; color:#666;" id="capturedPreviewText">請點選下方卡片進行歸類：</div>
    
    <div class="assign-grid" id="assignGrid"></div>
    
    <button class="secondary" style="width:100%; margin-top:16px; padding:12px;" onclick="closeModal()">取消 / 不歸類</button>
  </div>
</div>

<script>
// --- IndexedDB Database Setup ---
const db = new Dexie("KindergartenPhotoDB");
db.version(1).stores({
  settings: "key",
  students: "++id, name",
  photos: "++id, studentId, timestamp"
});

let settings = { className: "", targetPhotos: 3 };
let students = [];
let tempCapturedBlob = null;
let enrollingStudentId = null;
let isAiReady = false;
let faceMatcher = null;
let filter = "all";

// --- App Initialization ---
async function initApp() {
  await loadSettings();
  await loadStudents();
  render();
  initAI();
}

async function loadSettings() {
  const savedClass = await db.settings.get("className");
  const savedTarget = await db.settings.get("targetPhotos");
  if (savedClass) settings.className = savedClass.value;
  if (savedTarget) settings.targetPhotos = savedTarget.value;
}

async function saveSettings() {
  const cName = document.getElementById("className").value.trim();
  const tPhotos = parseInt(document.getElementById("targetPhotos").value, 10) || 3;
  
  settings.className = cName;
  settings.targetPhotos = tPhotos;

  await db.settings.put({ key: "className", value: cName });
  await db.settings.put({ key: "targetPhotos", value: tPhotos });
  render();
}

async function loadStudents() {
  students = await db.students.toArray();
  for (let s of students) {
    s.photosCount = await db.photos.where("studentId").equals(s.id).count();
  }
}

// --- AI Model Loading ---
async function initAI() {
  const statusDiv = document.getElementById("aiStatus");
  try {
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark64Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    isAiReady = true;
    statusDiv.className = "ai-status ready";
    statusDiv.textContent = "🤖 AI 人臉辨識就緒（IndexedDB & 家長分享版）";
    rebuildFaceMatcher();
  } catch (err) {
    statusDiv.className = "ai-status";
    statusDiv.style.background = "#fee2e2";
    statusDiv.style.color = "#991b1b";
    statusDiv.textContent = "⚠️ AI 模型載入失敗，將採用手動歸類模式。";
  }
}

function rebuildFaceMatcher() {
  if (!isAiReady) return;
  const labeledDescriptors = [];
  students.forEach((s) => {
    if (s.descriptor && s.descriptor.length === 128) {
      const desc = new Float32Array(s.descriptor);
      labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(String(s.id), [desc]));
    }
  });

  if (labeledDescriptors.length > 0) {
    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
  } else {
    faceMatcher = null;
  }
}

function triggerCamera() {
  if (!students.length) {
    alert("請先新增學生名單，再進行拍照！");
    return;
  }
  document.getElementById("cameraInput").click();
}

function triggerEnroll(studentId) {
  enrollingStudentId = studentId;
  document.getElementById("enrollInput").click();
}

async function handleEnrollPhoto(e) {
  const file = e.target.files[0];
  if (!file || enrollingStudentId === null) return;

  const statusDiv = document.getElementById("aiStatus");
  statusDiv.textContent = "🔄 正在分析人臉特徵...";

  const img = await faceapi.bufferToImage(file);
  const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!detection) {
    alert("⚠️ 未能清晰偵測到人臉，請重新上傳照片。");
  } else {
    const descriptorArray = Array.from(detection.descriptor);
    await db.students.update(enrollingStudentId, { descriptor: descriptorArray });
    await loadStudents();
    rebuildFaceMatcher();
    render();
    alert("成功設定 AI 人臉特徵！");
  }

  statusDiv.textContent = "🤖 AI 人臉辨識就緒（IndexedDB & 家長分享版）";
  e.target.value = "";
  enrollingStudentId = null;
}

async function handlePhotoCaptured(e) {
  const file = e.target.files[0];
  if (!file) return;

  tempCapturedBlob = file; 
  
  let matchedStudentId = null;
  let confidence = 0;

  if (isAiReady && faceMatcher) {
    const img = await faceapi.bufferToImage(file);
    const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (detection) {
      const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
      if (bestMatch.label !== 'unknown') {
        matchedStudentId = parseInt(bestMatch.label, 10);
        confidence = Math.round((1 - bestMatch.distance) * 100);
      }
    }
  }

  openAssignModal(matchedStudentId, confidence);
  e.target.value = "";
}

function openAssignModal(matchedStudentId = null, confidence = 0) {
  const modal = document.getElementById("assignModal");
  const grid = document.getElementById("assignGrid");
  const target = settings.targetPhotos || 3;
  const previewText = document.getElementById("capturedPreviewText");

  const matchedStudent = students.find(s => s.id === matchedStudentId);
  if (matchedStudent) {
    previewText.innerHTML = `✨ <strong style="color:#2563eb;">AI 辨識匹配：${escapeHtml(matchedStudent.name)}</strong> (${confidence}% 信心度)`;
  } else {
    previewText.textContent = "請點選下方卡片進行歸類：";
  }

  let orderedStudents = [...students];
  if (matchedStudentId !== null) {
    orderedStudents.sort((a, b) => (a.id === matchedStudentId ? -1 : b.id === matchedStudentId ? 1 : 0));
  }

  grid.innerHTML = orderedStudents.map(s => {
    const photos = s.photosCount || 0;
    const isUnder = photos < target;
    const isMatched = s.id === matchedStudentId;

    return `
      <div class="assign-card ${isMatched ? 'ai-matched' : ''}" onclick="assignPhotoToStudent(${s.id})">
        ${isMatched ? `<div class="ai-badge-top">AI 推薦 (${confidence}%)</div>` : ''}
        <div style="font-weight:600; font-size:15px; ${isMatched ? 'color:#2563eb;' : ''}">${escapeHtml(s.name)}</div>
        <div class="count" style="${isUnder ? 'color:#e53e3e;font-weight:bold;' : ''}">
          目前: ${photos} / ${target} 張
        </div>
      </div>
    `;
  }).join("");

  modal.classList.add("active");
}

function closeModal() {
  document.getElementById("assignModal").classList.remove("active");
  tempCapturedBlob = null;
}

async function assignPhotoToStudent(studentId) {
  if (studentId && tempCapturedBlob) {
    await db.photos.add({
      studentId: studentId,
      blob: tempCapturedBlob,
      timestamp: new Date().getTime()
    });
    await loadStudents();
    render();
  }
  closeModal();
}

// --- Share Photos to Parents Feature ---
async function shareStudentPhotos(studentId) {
  const student = students.find(s => s.id === studentId);
  const photoRecords = await db.photos.where("studentId").equals(studentId).toArray();
  
  const validBlobs = photoRecords.filter(p => p.blob).map(p => p.blob);

  if (validBlobs.length === 0) {
    alert(`目前沒有 ${student.name} 的照片可供傳送！`);
    return;
  }

  const files = validBlobs.map((blob, index) => {
    return new File([blob], `${student.name}_photo_${index + 1}.jpg`, { type: blob.type || "image/jpeg" });
  });

  if (navigator.canShare && navigator.canShare({ files: files })) {
    try {
      await navigator.share({
        title: `${student.name} 的今日園所照片`,
        text: `家長您好！這是 ${student.name} 今天在學校的照片 📸`,
        files: files
      });
    } catch (err) {
      if (err.name !== 'AbortError') {
        alert("分享過程發生錯誤，改為直接下載照片。");
        downloadFiles(files);
      }
    }
  } else {
    alert("您的瀏覽器或設備不支援直接跨 APP 分享檔案，系統將為您自動下載照片！");
    downloadFiles(files);
  }
}

function downloadFiles(files) {
  files.forEach(file => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = file.name;
    a.click();
  });
}

async function addStudent() {
  const input = document.getElementById("studentName");
  const name = input.value.trim();
  if (!name) return;
  if (students.some(s => s.name === name)) {
    alert("這個名字已經存在囉！");
    return;
  }
  await db.students.add({ name: name, descriptor: null });
  input.value = "";
  await loadStudents();
  rebuildFaceMatcher();
  render();
  input.focus();
}

async function addPhoto(studentId) {
  await db.photos.add({ studentId: studentId, blob: null, timestamp: new Date().getTime() });
  await loadStudents();
  render();
}

async function removePhoto(studentId) {
  const lastPhoto = await db.photos.where("studentId").equals(studentId).last();
  if (lastPhoto) {
    await db.photos.delete(lastPhoto.id);
    await loadStudents();
    render();
  }
}

async function deleteStudent(studentId) {
  const student = students.find(s => s.id === studentId);
  if (!confirm(`確定要刪除「${student.name}」嗎？`)) return;
  await db.students.delete(studentId);
  await db.photos.where("studentId").equals(studentId).delete();
  await loadStudents();
  rebuildFaceMatcher();
  render();
}

async function resetToday() {
  if (!confirm("確定要重置今天的拍攝張數與照片嗎？")) return;
  await db.photos.clear();
  await loadStudents();
  render();
}

async function clearStudents() {
  if (!students.length) return;
  if (!confirm("確定要刪除全部學生名單與照片嗎？")) return;
  await db.students.clear();
  await db.photos.clear();
  await loadStudents();
  rebuildFaceMatcher();
  render();
}

function setFilter(value) {
  filter = value;
  document.querySelectorAll(".filters button").forEach(b => {
    b.classList.remove("active");
    b.classList.add("secondary");
  });
  const btnId = value + "Btn";
  const activeBtn = document.getElementById(btnId);
  if (activeBtn) {
    activeBtn.classList.add("active");
    activeBtn.classList.remove("secondary");
  }
  renderList();
}

async function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(evt) {
    const text = evt.target.result;
    const lines = text.split(/[\r\n,]+/);
    let count = 0;

    for (let line of lines) {
      const name = line.trim();
      if (name && name !== "姓名" && name !== "Name" && !students.some(s => s.name === name)) {
        await db.students.add({ name: name, descriptor: null });
        count++;
      }
    }

    await loadStudents();
    rebuildFaceMatcher();
    render();
    alert(`成功匯入 ${count} 位學生名單！`);
    e.target.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

function exportCSV() {
  if (!students.length) {
    alert("目前沒有學生資料可供匯出。");
    return;
  }

  const target = settings.targetPhotos || 3;
  let csvContent = "\uFEFF姓名,拍攝張數,是否達標(目標" + target + "張)\n";
  
  students.forEach(s => {
    const isDone = (s.photosCount || 0) >= target ? "是" : "否";
    csvContent += `"${s.name}",${s.photosCount || 0},"${isDone}"\n`;
  });

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  
  const className = settings.className ? settings.className + "_" : "";
  const dateStr = new Date().toISOString().split('T')[0];
  
  link.setAttribute("href", url);
  link.setAttribute("download", `${className}拍照統計記錄_${dateStr}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function render() {
  document.getElementById("className").value = settings.className || "";
  document.getElementById("targetPhotos").value = settings.targetPhotos || 3;

  const total = students.length;
  const target = settings.targetPhotos || 3;
  
  const doneCount = students.filter(s => (s.photosCount || 0) >= target).length;
  const underTargetCount = students.filter(s => (s.photosCount || 0) < target).length;
  const photoTotal = students.reduce((sum, s) => sum + (s.photosCount || 0), 0);
  
  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  const avg = total ? (photoTotal / total).toFixed(1) : "0";

  document.getElementById("progressText").textContent = `已達標 ${doneCount} / ${total} 人`;
  document.getElementById("photoTotal").textContent = `總張數：${photoTotal} 張`;
  document.getElementById("averagePhotos").textContent = `${avg} 張/人`;
  document.getElementById("percent").textContent = `${pct}%`;
  document.getElementById("underTargetCount").textContent = `${underTargetCount} 人`;
  document.getElementById("bar").style.width = `${pct}%`;

  renderList();
}

async function renderList() {
  const box = document.getElementById("studentList");
  const target = settings.targetPhotos || 3;
  let list = [...students];

  if (filter === "todo") list = list.filter(s => (s.photosCount || 0) === 0);
  if (filter === "under") list = list.filter(s => (s.photosCount || 0) < target);
  if (filter === "done") list = list.filter(s => (s.photosCount || 0) >= target);

  if (!list.length) {
    box.innerHTML = '<div class="empty">目前沒有符合條件的小朋友</div>';
    return;
  }

  box.innerHTML = "";

  for (let s of list) {
    const photos = s.photosCount || 0;
    const isDone = photos >= target;
    const isZero = photos === 0;
    const hasDescriptor = s.descriptor && s.descriptor.length === 128;

    let badgeHtml = '';
    if (isZero) {
      badgeHtml = '<span class="badge badge-danger">未拍攝</span>';
    } else if (photos < target) {
      badgeHtml = `<span class="badge badge-warning">差 ${target - photos} 張</span>`;
    } else {
      badgeHtml = '<span class="badge badge-success">已達標</span>';
    }

    if (hasDescriptor) {
      badgeHtml += '<span class="badge badge-ai">🤖 AI已錄入</span>';
    }

    const photoRecords = await db.photos.where("studentId").equals(s.id).toArray();
    let thumbsHtml = '';
    if (photoRecords.length > 0) {
      thumbsHtml = '<div class="photo-thumbs">';
      for (let p of photoRecords) {
        if (p.blob) {
          const imgUrl = URL.createObjectURL(p.blob);
          thumbsHtml += `<img src="${imgUrl}" class="thumb">`;
        }
      }
      thumbsHtml += '</div>';
    }

    const card = document.createElement("div");
    card.className = `student ${isDone ? "done" : ""} ${!isDone ? "alert-target" : ""}`;
    card.innerHTML = `
      <div>
        <div class="name">${escapeHtml(s.name)} ${badgeHtml}</div>
        <div class="status">目標：${target} 張｜當前：${photos} 張</div>
        ${thumbsHtml}
      </div>
      <div class="btn-group">
        <button class="share-btn" onclick="shareStudentPhotos(${s.id})" style="padding: 6px 10px; font-size:12px;">📤 傳送照片</button>
        <button class="secondary" onclick="triggerEnroll(${s.id})" style="padding: 6px 10px; font-size:12px;">👤 建立人臉</button>
        <button class="secondary" onclick="removePhoto(${s.id})" ${photos === 0 ? "disabled" : ""}>−</button>
        <strong style="min-width: 45px; text-align: center;">📸 ${photos}</strong>
        <button class="check" onclick="addPhoto(${s.id})">＋1 張</button>
        <button class="secondary" onclick="deleteStudent(${s.id})" style="padding: 6px 10px; font-size:12px;">刪除</button>
      </div>
    `;
    box.appendChild(card);
  }
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// Service Worker for PWA Offline Caching
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  });
}

document.getElementById("studentName").addEventListener("keydown", e => { if (e.key === "Enter") addStudent(); });
document.getElementById("className").addEventListener("keydown", e => { if (e.key === "Enter") saveSettings(); });

window.addEventListener('DOMContentLoaded', initApp);
</script>
