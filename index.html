<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#222222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>幼兒園拍照防漏拍 Pro (AI 加強版)</title>

<!-- AI Face API Library -->
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<!-- 動態產生的 PWA Manifest -->
<script>
  const manifest = {
    "name": "幼兒園拍照防漏拍 Pro",
    "short_name": "防漏拍AI",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#f6f7fb",
    "theme_color": "#222222",
    "icons": [{
      "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>",
      "sizes": "192x192",
      "type": "image/svg+xml"
    }]
  };
  const stringManifest = JSON.stringify(manifest);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
</script>

<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    background: #f6f7fb; color: #222; padding-bottom: 80px;
  }
  .app { max-width: 760px; margin: auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: #666; margin-bottom: 14px; font-size: 13px; }
  
  .card {
    background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
  }
  .top { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px;
    font-size: 15px; outline: none; background: white;
  }
  .field { flex: 1; min-width: 140px; }
  
  button {
    border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px;
    cursor: pointer; background: #222; color: white; font-weight: 500;
  }
  button.secondary { background: #eee; color: #222; }
  button.danger { background: #ffe9e9; color: #b42318; }
  button.camera-btn {
    background: #2563eb; color: white; font-weight: bold; width: 100%;
    padding: 14px; font-size: 16px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .stats { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .progress { height: 10px; background: #eee; border-radius: 99px; overflow: hidden; margin: 8px 0; }
  .bar { height: 100%; width: 0%; background: #222; transition: width .2s; }
  
  .filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .filters button.active { background: #222; color: white; }
  
  .student {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; border: 1px solid #eee; border-radius: 12px; margin: 8px 0;
    gap: 10px; background: #fff; transition: background .2s;
  }
  .student.alert-target { border-left: 5px solid #e53e3e; }
  .student.done { background: #f9fbf8; }
  
  .name { font-size: 16px; font-weight: 600; }
  .status { font-size: 12px; margin-top: 2px; color: #777; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 4px; }
  .badge-danger { background: #fed7d7; color: #9b2c2c; }
  .badge-warning { background: #feebc8; color: #9c4221; }
  .badge-success { background: #c6f6d5; color: #22543d; }
  .badge-ai { background: #e0e7ff; color: #3730a3; }
  
  .btn-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .empty { text-align: center; color: #777; padding: 20px; font-size: 14px; }
  .addrow { display: flex; gap: 8px; }
  .addrow input { flex: 1; }
  
  .photo-thumbs { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; border: 1px solid #ddd; }

  /* AI matching highlights */
  .ai-status { font-size: 12px; padding: 8px; border-radius: 8px; margin-bottom: 12px; text-align: center; }
  .ai-status.loading { background: #e0f2fe; color: #0369a1; }
  .ai-status.ready { background: #dcfce7; color: #15803d; }

  /* Modal Popup */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: white; border-radius: 20px 20px 0 0; padding: 20px;
    width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .assign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .assign-card {
    border: 2px solid #eee; border-radius: 12px; padding: 12px; text-align: center;
    cursor: pointer; background: #f9f9f9; transition: all 0.15s; position: relative;
  }
  .assign-card.ai-matched { border-color: #2563eb; background: #eff6ff; box-shadow: 0 0 10px rgba(37,99,235,0.2); }
  .assign-card:active { transform: scale(0.96); background: #ebf8ff; border-color: #3182ce; }
  .assign-card .count { font-size: 12px; color: #666; margin-top: 4px; }
  .ai-badge-top { position: absolute; top: -10px; right: 8px; background: #2563eb; color: white; font-size: 10px; padding: 2px 6px; border-radius: 99px; }

  @media (max-width: 520px) {
    .app { padding: 12px; }
    .student { flex-direction: column; align-items: flex-start; }
    .btn-group { width: 100%; justify-content: space-between; margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>📸 幼兒園拍照防漏拍 Pro (AI 辨識版)</h1>
  <div class="sub">拍照後自動辨識學童並進行歸類，數據與相片本地自動儲存。</div>

  <!-- AI 狀態提示 -->
  <div id="aiStatus" class="ai-status loading">🤖 正在載入 AI 人臉辨識模型中...</div>

  <!-- 相機拍攝核心按鈕 -->
  <div class="card">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoCaptured(event)">
    <button class="camera-btn" onclick="triggerCamera()">
      📷 開啟相機拍攝並 AI 歸類
    </button>
  </div>

  <!-- 班級與目標設定 -->
  <div class="card">
    <div class="top">
      <div class="field">
        <label>班級名稱</label>
        <input id="className" placeholder="例如：彩虹班" onchange="saveClass()">
      </div>
      <div class="field" style="max-width: 120px;">
        <label>目標張數/人</label>
        <input id="targetPhotos" type="number" min="1" value="3" onchange="saveTarget()">
      </div>
    </div>
  </div>

  <!-- 儀表板與統計 -->
  <div class="card">
    <div class="stats">
      <strong id="progressText">已達標 0 / 0 人</strong>
      <span id="photoTotal">總張數：0 張</span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="stats" style="margin-top:4px;">
      <span>完成率：<span id="percent">0%</span></span>
      <span>平均：<span id="averagePhotos">0 張/人</span></span>
      <span>未達標：<strong id="underTargetCount" style="color:#e53e3e;">0 人</strong></span>
    </div>

    <!-- 快速篩選 -->
    <div class="filters">
      <button id="allBtn" class="active" onclick="setFilter('all')">全部</button>
      <button id="todoBtn" class="secondary" onclick="setFilter('todo')">未拍攝 (0張)</button>
      <button id="underBtn" class="secondary" onclick="setFilter('under')">未達目標張數</button>
      <button id="doneBtn" class="secondary" onclick="setFilter('done')">已達標</button>
    </div>
  </div>

  <!-- 新增與匯入 -->
  <div class="card">
    <strong>新增學生與匯入名單</strong>
    <div class="addrow" style="margin-top:8px;">
      <input id="studentName" placeholder="輸入學生姓名">
      <button onclick="addStudent()">新增</button>
    </div>
    <div style="margin-top:10px;">
      <input type="file" id="csvFileInput" accept=".csv, .txt" style="display:none" onchange="importCSV(event)">
      <button class="secondary" style="width:100%;" onclick="document.getElementById('csvFileInput').click()">📥 批次匯入名單 (CSV/TXT)</button>
    </div>
  </div>

  <!-- 隱藏的 Face Enrollment Input -->
  <input type="file" id="enrollInput" accept="image/*" style="display:none" onchange="handleEnrollPhoto(event)">

  <!-- 學生名單列表 -->
  <div class="card">
    <div id="studentList"></div>
  </div>

  <!-- 底部操作區 -->
  <div class="card" style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="secondary" onclick="resetToday()">↩ 今日重置</button>
    <button class="secondary" onclick="exportCSV()">📤 匯出記錄 (CSV)</button>
    <button class="danger" onclick="clearStudents()" style="margin-left:auto;">刪除名單</button>
  </div>
</div>

<!-- 照片歸類 Modal 彈窗 -->
<div class="modal-overlay" id="assignModal">
  <div class="modal-content">
    <h3 style="margin-top:0; margin-bottom:4px;">🎯 這張照片是哪位小朋友的？</h3>
    <div style="font-size:12px; color:#666;" id="capturedPreviewText">請點選下方卡片進行歸類：</div>
    
    <div class="assign-grid" id="assignGrid"></div>
    
    <button class="secondary" style="width:100%; margin-top:16px; padding:12px;" onclick="closeModal()">取消 / 不歸類</button>
  </div>
</div>

<script>
const KEY = "kindergarten_photo_tracker_v3";
let tempCapturedPhoto = null;
let enrollingStudentIndex = null;
let isAiReady = false;
let faceMatcher = null;

let data = JSON.parse(localStorage.getItem(KEY) || '{"className":"","targetPhotos":3,"students":[]}');
if (!data.targetPhotos) data.targetPhotos = 3;

data.students = (data.students || []).map(s => ({
  name: s.name,
  photos: typeof s.photos === "number" ? s.photos : 0,
  images: s.images || [],
  descriptor: s.descriptor || null // 儲存 128D AI Face Vector
}));

let filter = "all";

// --- AI 初始化與建構 ---
async function initAI() {
  const statusDiv = document.getElementById("aiStatus");
  try {
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark64Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    isAiReady = true;
    statusDiv.className = "ai-status ready";
    statusDiv.textContent = "🤖 AI 人臉辨識就緒（離線可用）";
    rebuildFaceMatcher();
  } catch (err) {
    statusDiv.className = "ai-status";
    statusDiv.style.background = "#fee2e2";
    statusDiv.style.color = "#991b1b";
    statusDiv.textContent = "⚠️ AI 模型載入失敗，將採用手動歸類模式。";
  }
}

function rebuildFaceMatcher() {
  if (!isAiReady) return;
  const labeledDescriptors = [];
  data.students.forEach((s, idx) => {
    if (s.descriptor && s.descriptor.length === 128) {
      const desc = new Float32Array(s.descriptor);
      labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(String(idx), [desc]));
    }
  });

  if (labeledDescriptors.length > 0) {
    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
  } else {
    faceMatcher = null;
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (e) {
    alert("儲存空間滿囉！建議定期匯出記錄並清空舊照片。");
  }
}

function triggerCamera() {
  if (!data.students.length) {
    alert("請先新增學生名單，再進行拍照！");
    return;
  }
  document.getElementById("cameraInput").click();
}

// 建立人臉特徵檔 (Enrollment)
function triggerEnroll(index) {
  enrollingStudentIndex = index;
  document.getElementById("enrollInput").click();
}

async function handleEnrollPhoto(e) {
  const file = e.target.files[0];
  if (!file || enrollingStudentIndex === null) return;

  const statusDiv = document.getElementById("aiStatus");
  statusDiv.textContent = "🔄 正在分析人臉特徵...";

  const img = await faceapi.bufferToImage(file);
  const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!detection) {
    alert("⚠️ 未能清晰偵測到人臉，請重新上傳照片。");
  } else {
    data.students[enrollingStudentIndex].descriptor = Array.from(detection.descriptor);
    save();
    rebuildFaceMatcher();
    render();
    alert(`成功為「${data.students[enrollingStudentIndex].name}」設定 AI 人臉特徵！`);
  }

  statusDiv.textContent = "🤖 AI 人臉辨識就緒（離線可用）";
  e.target.value = "";
  enrollingStudentIndex = null;
}

// 處理照片拍攝與 AI 自動辨識 matching
async function handlePhotoCaptured(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(evt) {
    tempCapturedPhoto = evt.target.result;
    
    let matchedIndex = null;
    let confidence = 0;

    if (isAiReady && faceMatcher) {
      const img = await faceapi.bufferToImage(file);
      const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (detection) {
        const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
        if (bestMatch.label !== 'unknown') {
          matchedIndex = parseInt(bestMatch.label, 10);
          confidence = Math.round((1 - bestMatch.distance) * 100);
        }
      }
    }

    openAssignModal(matchedIndex, confidence);
    e.target.value = "";
  };
  reader.readAsDataURL(file);
}

function openAssignModal(matchedIndex = null, confidence = 0) {
  const modal = document.getElementById("assignModal");
  const grid = document.getElementById("assignGrid");
  const target = data.targetPhotos || 3;
  const previewText = document.getElementById("capturedPreviewText");

  if (matchedIndex !== null) {
    previewText.innerHTML = `✨ <strong style="color:#2563eb;">AI 辨識匹配：${escapeHtml(data.students[matchedIndex].name)}</strong> (${confidence}% 信心度)`;
  } else {
    previewText.textContent = "請點選下方卡片進行歸類：";
  }

  // 將匹配對象排至第一位顯示
  let studentIndices = data.students.map((_, i) => i);
  if (matchedIndex !== null) {
    studentIndices = studentIndices.filter(i => i !== matchedIndex);
    studentIndices.unshift(matchedIndex);
  }

  grid.innerHTML = studentIndices.map(index => {
    const s = data.students[index];
    const photos = s.photos || 0;
    const isUnder = photos < target;
    const isMatched = index === matchedIndex;

    return `
      <div class="assign-card ${isMatched ? 'ai-matched' : ''}" onclick="assignPhotoToStudent(${index})">
        ${isMatched ? `<div class="ai-badge-top">AI 推薦 (${confidence}%)</div>` : ''}
        <div style="font-weight:600; font-size:15px; ${isMatched ? 'color:#2563eb;' : ''}">${escapeHtml(s.name)}</div>
        <div class="count" style="${isUnder ? 'color:#e53e3e;font-weight:bold;' : ''}">
          目前: ${photos} / ${target} 張
        </div>
      </div>
    `;
  }).join("");

  modal.classList.add("active");
}

function closeModal() {
  document.getElementById("assignModal").classList.remove("active");
  tempCapturedPhoto = null;
}

function assignPhotoToStudent(index) {
  if (index >= 0 && index < data.students.length) {
    data.students[index].photos = (data.students[index].photos || 0) + 1;
    if (tempCapturedPhoto) {
      if (!data.students[index].images) data.students[index].images = [];
      data.students[index].images.push(tempCapturedPhoto);
    }
    save();
    render();
  }
  closeModal();
}

function saveClass() {
  data.className = document.getElementById("className").value.trim();
  save();
  render();
}

function saveTarget() {
  const val = parseInt(document.getElementById("targetPhotos").value, 10);
  data.targetPhotos = (val && val > 0) ? val : 1;
  save();
  render();
}

function addStudent() {
  const input = document.getElementById("studentName");
  const name = input.value.trim();
  if (!name) return;
  if (data.students.some(s => s.name === name)) {
    alert("這個名字已經存在囉！");
    return;
  }
  data.students.push({ name, photos: 0, images: [], descriptor: null });
  input.value = "";
  save();
  rebuildFaceMatcher();
  render();
  input.focus();
}

function addPhoto(index) {
  data.students[index].photos = (data.students[index].photos || 0) + 1;
  save();
  render();
}

function removePhoto(index) {
  data.students[index].photos = Math.max(0, (data.students[index].photos || 0) - 1);
  if (data.students[index].images && data.students[index].images.length > data.students[index].photos) {
    data.students[index].images.pop();
  }
  save();
  render();
}

function deleteStudent(index) {
  if (!confirm(`確定要刪除「${data.students[index].name}」嗎？`)) return;
  data.students.splice(index, 1);
  save();
  rebuildFaceMatcher();
  render();
}

function resetToday() {
  if (!confirm("確定要重置今天的拍攝張數與照片嗎？")) return;
  data.students.forEach(s => {
    s.photos = 0;
    s.images = [];
  });
  save();
  render();
}

function clearStudents() {
  if (!data.students.length) return;
  if (!confirm("確定要刪除全部學生名單嗎？")) return;
  data.students = [];
  save();
  rebuildFaceMatcher();
  render();
}

function setFilter(value) {
  filter = value;
  document.querySelectorAll(".filters button").forEach(b => {
    b.classList.remove("active");
    b.classList.add("secondary");
  });
  const btnId = value + "Btn";
  const activeBtn = document.getElementById(btnId);
  if (activeBtn) {
    activeBtn.classList.add("active");
    activeBtn.classList.remove("secondary");
  }
  renderList();
}

function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    const text = evt.target.result;
    const lines = text.split(/[\r\n,]+/);
    let count = 0;

    lines.forEach(line => {
      const name = line.trim();
      if (name && name !== "姓名" && name !== "Name" && !data.students.some(s => s.name === name)) {
        data.students.push({ name, photos: 0, images: [], descriptor: null });
        count++;
      }
    });

    save();
    rebuildFaceMatcher();
    render();
    alert(`成功匯入 ${count} 位學生名單！`);
    e.target.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

function exportCSV() {
  if (!data.students.length) {
    alert("目前沒有學生資料可供匯出。");
    return;
  }

  const target = data.targetPhotos || 3;
  let csvContent = "\uFEFF姓名,拍攝張數,是否達標(目標" + target + "張)\n";
  
  data.students.forEach(s => {
    const isDone = (s.photos || 0) >= target ? "是" : "否";
    csvContent += `"${s.name}",${s.photos || 0},"${isDone}"\n`;
  });

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  
  const className = data.className ? data.className + "_" : "";
  const dateStr = new Date().toISOString().split('T')[0];
  
  link.setAttribute("href", url);
  link.setAttribute("download", `${className}拍照統計記錄_${dateStr}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function render() {
  document.getElementById("className").value = data.className || "";
  document.getElementById("targetPhotos").value = data.targetPhotos || 3;

  const total = data.students.length;
  const target = data.targetPhotos || 3;
  
  const doneCount = data.students.filter(s => (s.photos || 0) >= target).length;
  const underTargetCount = data.students.filter(s => (s.photos || 0) < target).length;
  const photoTotal = data.students.reduce((sum, s) => sum + (s.photos || 0), 0);
  
  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  const avg = total ? (photoTotal / total).toFixed(1) : "0";

  document.getElementById("progressText").textContent = `已達標 ${doneCount} / ${total} 人`;
  document.getElementById("photoTotal").textContent = `總張數：${photoTotal} 張`;
  document.getElementById("averagePhotos").textContent = `${avg} 張/人`;
  document.getElementById("percent").textContent = `${pct}%`;
  document.getElementById("underTargetCount").textContent = `${underTargetCount} 人`;
  document.getElementById("bar").style.width = `${pct}%`;

  renderList();
}

function renderList() {
  const box = document.getElementById("studentList");
  const target = data.targetPhotos || 3;
  let list = data.students.map((s, i) => ({ ...s, index: i }));

  if (filter === "todo") list = list.filter(s => (s.photos || 0) === 0);
  if (filter === "under") list = list.filter(s => (s.photos || 0) < target);
  if (filter === "done") list = list.filter(s => (s.photos || 0) >= target);

  if (!list.length) {
    box.innerHTML = '<div class="empty">目前沒有符合條件的小朋友</div>';
    return;
  }

  box.innerHTML = list.map(s => {
    const photos = s.photos || 0;
    const isDone = photos >= target;
    const isZero = photos === 0;
    const hasDescriptor = s.descriptor && s.descriptor.length === 128;

    let badgeHtml = '';
    if (isZero) {
      badgeHtml = '<span class="badge badge-danger">未拍攝</span>';
    } else if (photos < target) {
      badgeHtml = `<span class="badge badge-warning">差 ${target - photos} 張</span>`;
    } else {
      badgeHtml = '<span class="badge badge-success">已達標</span>';
    }

    if (hasDescriptor) {
      badgeHtml += '<span class="badge badge-ai">🤖 AI已錄入</span>';
    }

    let thumbsHtml = '';
    if (s.images && s.images.length > 0) {
      thumbsHtml = `<div class="photo-thumbs">${s.images.map(img => `<img src="${img}" class="thumb">`).join("")}</div>`;
    }

    return `
      <div class="student ${isDone ? "done" : ""} ${!isDone ? "alert-target" : ""}">
        <div>
          <div class="name">${escapeHtml(s.name)} ${badgeHtml}</div>
          <div class="status">目標：${target} 張｜當前：${photos} 張</div>
          ${thumbsHtml}
        </div>
        <div class="btn-group">
          <button class="secondary" onclick="triggerEnroll(${s.index})" style="padding: 6px 10px; font-size:12px;">👤 建立人臉</button>
          <button class="secondary" onclick="removePhoto(${s.index})" ${photos === 0 ? "disabled" : ""}>−</button>
          <strong style="min-width: 45px; text-align: center;">📸 ${photos}</strong>
          <button class="check" onclick="addPhoto(${s.index})">＋1 張</button>
          <button class="secondary" onclick="deleteStudent(${s.index})" style="padding: 6px 10px; font-size:12px;">刪除</button>
        </div>
      </div>
    `;
  }).join("");
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// Service Worker for PWA Offline Caching
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  });
}

// Event Listeners
document.getElementById("studentName").addEventListener("keydown", e => { if (e.key === "Enter") addStudent(); });
document.getElementById("className").addEventListener("keydown", e => { if (e.key === "Enter") saveClass(); });

// Run Initialization
window.addEventListener('DOMContentLoaded', () => {
  render();
  initAI();
});
</script>
