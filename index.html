<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ec4899">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>幼兒園拍照防漏拍 Pro 🎀 (粉紅可愛版)</title>

<!-- Dexie.js for IndexedDB -->
<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
<!-- AI Face API Library -->
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<!-- Dynamic PWA Manifest -->
<script>
  const manifest = {
    "name": "幼兒園拍照防漏拍 Pro",
    "short_name": "防漏拍IndexedDB",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#fdf2f8",
    "theme_color": "#ec4899",
    "icons": [{
      "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>",
      "sizes": "192x192",
      "type": "image/svg+xml"
    }]
  };
  const stringManifest = JSON.stringify(manifest);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
</script>

<style>
  :root {
    --primary: #ec4899;
    --primary-light: #fce7f3;
    --primary-dark: #db2777;
    --accent: #f472b6;
    --success: #10b981;
    --danger: #f43f5e;
    --warning: #f59e0b;
    --bg-main: #fff5f7;
    --card-bg: #ffffff;
    --text-main: #831843;
    --text-muted: #9d4c6c;
    --border: #fbcfe8;
  }

  * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: var(--bg-main); color: var(--text-main); padding-bottom: 95px;
  }

  /* Cute Header */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, #f472b6, #ec4899);
    color: white; padding: 14px 16px;
    border-radius: 0 0 20px 20px;
    box-shadow: 0 4px 15px rgba(236,72,153,0.3);
  }
  .header h1 { margin: 0; font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
  .header-sub { font-size: 12px; opacity: 0.95; margin-top: 3px; font-weight: 500; }

  .app { max-width: 600px; margin: 0 auto; padding: 12px; }

  /* Navigation Tabs Bottom Bar */
  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: white;
    display: flex; border-top: 2px solid var(--border); z-index: 1000;
    box-shadow: 0 -4px 15px rgba(236,72,153,0.1);
    border-radius: 20px 20px 0 0;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; border: 0; background: transparent;
  }
  .nav-item.active { color: var(--primary-dark); font-weight: 800; }
  .nav-item .icon { font-size: 22px; margin-bottom: 2px; }

  /* Views Management */
  .view { display: none; }
  .view.active { display: block; }

  /* Cute Cards */
  .card {
    background: var(--card-bg); border-radius: 20px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(244,114,182,0.12); border: 2px solid #fce7f3;
  }

  /* Buttons */
  button {
    border: 0; border-radius: 14px; padding: 10px 14px; font-size: 13px;
    cursor: pointer; background: #fce7f3; color: var(--text-main); font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: all 0.15s ease;
  }
  button:active { transform: scale(0.95); }
  button.primary { background: linear-gradient(135deg, #f472b6, #ec4899); color: white; box-shadow: 0 3px 8px rgba(236,72,153,0.25); }
  button.share-btn { background: #10b981; color: white; }
  button.danger { background: #ffe4e6; color: var(--danger); }
  button.camera-btn {
    background: linear-gradient(135deg, #f472b6, #db2777); color: white; font-size: 17px; font-weight: 800; width: 100%;
    padding: 16px; border-radius: 18px; box-shadow: 0 6px 18px rgba(236,72,153,0.35); letter-spacing: 0.5px;
  }

  /* Form Elements */
  label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 700; }
  input, select {
    width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 12px;
    font-size: 14px; outline: none; background: white; color: var(--text-main); font-weight: 600;
  }
  input:focus { border-color: var(--primary); }

  /* Stats Bar */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-top: 10px; }
  .stat-box { background: #fff1f2; padding: 10px 6px; border-radius: 14px; border: 1px solid #fecdd3; }
  .stat-val { font-size: 17px; font-weight: 800; color: var(--primary-dark); }
  .stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-weight: 600; }

  .progress { height: 12px; background: #fce7f3; border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f472b6, #ec4899); transition: width .3s; }

  /* Student List Card Design */
  .student-card {
    background: white; border-radius: 18px; padding: 14px; margin-bottom: 10px;
    border: 2px solid #fce7f3; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 2px 8px rgba(236,72,153,0.06);
  }
  .student-card.done { background: #fafaf9; border-color: #e7e5e4; opacity: 0.9; }
  .student-card.alert-target { border-left: 6px solid var(--danger); }

  .student-header { display: flex; align-items: center; gap: 12px; }
  
  /* Avatar Styling */
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
    border: 2px solid #fbcfe8; background: #fff1f2; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px; color: #f472b6;
    overflow: hidden; cursor: pointer; position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-sm { width: 42px; height: 42px; font-size: 18px; }

  .student-info { flex: 1; }
  .student-name { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .student-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }

  .badge { padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 800; }
  .badge-danger { background: #ffe4e6; color: #e11d48; }
  .badge-warning { background: #fef3c7; color: #d97706; }
  .badge-success { background: #d1fae5; color: #059669; }
  .badge-ai { background: #fce7f3; color: var(--primary-dark); }

  .student-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; border-top: 1px dashed var(--border); padding-top: 10px; }
  
  .photo-thumbs { display: flex; gap: 4px; margin-top: 6px; overflow-x: auto; padding-bottom: 2px; }
  .thumb { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }

  /* AI Status Bar */
  .ai-status { font-size: 12px; padding: 8px 12px; border-radius: 12px; margin-bottom: 10px; text-align: center; font-weight: 700; }
  .ai-status.loading { background: #fff1f2; color: #db2777; border: 1px solid #fecdd3; }
  .ai-status.ready { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }

  /* Filters */
  .filters { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
  .filters button { font-size: 12px; padding: 6px 12px; flex-shrink: 0; border-radius: 10px; background: white; border: 1px solid var(--border); }
  .filters button.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* Modal for Multi-Student Photo Tagging */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(131, 24, 67, 0.5); display: none; align-items: flex-end; justify-content: center;
    z-index: 2000; backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: white; border-radius: 28px 28px 0 0; padding: 22px 18px;
    width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
    animation: slideUp 0.25s cubic-bezier(0, 0, 0.2, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .assign-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
  
  .assign-card {
    border: 2px solid var(--border); border-radius: 16px; padding: 10px; text-align: center;
    cursor: pointer; background: #fffdfd; transition: all 0.15s; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .assign-card.selected { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 10px rgba(236,72,153,0.25); }
  .assign-card:active { transform: scale(0.96); }
  .assign-card .count { font-size: 11px; color: var(--text-muted); }
  
  .checkbox-badge {
    position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--border); background: white; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; color: white;
  }
  .assign-card.selected .checkbox-badge { background: var(--primary); border-color: var(--primary); }

  .empty { text-align: center; color: var(--text-muted); padding: 30px 10px; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <h1>🌸 幼兒園拍照防漏拍 Pro 🎀</h1>
  <div class="header-sub" id="headerSubText">載入中...</div>
</div>

<div class="app">
  <div id="aiStatus" class="ai-status loading">🤖 正在載入 AI 人臉辨識模組...</div>

  <!-- VIEW 1: CAMERA & PHOTO TRACKER -->
  <div id="viewCamera" class="view active">
    <div class="card">
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoCaptured(event)">
      <button class="camera-btn" onclick="triggerCamera()">
        📷 拍照 / 團體照歸類照片 💖
      </button>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong id="progressText" style="font-size:15px; font-weight:800;">已達標 0 / 0 人</strong>
        <span id="percent" style="font-weight:800; color:var(--primary-dark); font-size:16px;">0%</span>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="photoTotal">0</div>
          <div class="stat-lbl">總拍攝張數</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="averagePhotos">0</div>
          <div class="stat-lbl">平均張數/人</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="underTargetCount" style="color:var(--danger);">0</div>
          <div class="stat-lbl">未達標人數</div>
        </div>
      </div>
    </div>

    <div class="filters">
      <button id="allBtn" class="active" onclick="setFilter('all')">全部</button>
      <button id="todoBtn" onclick="setFilter('todo')">未拍攝 (0)</button>
      <button id="underBtn" onclick="setFilter('under')">未達標</button>
      <button id="doneBtn" onclick="setFilter('done')">已達標</button>
    </div>

    <div id="cameraStudentList"></div>
  </div>

  <!-- VIEW 2: STUDENT PROFILE MANAGEMENT -->
  <div id="viewStudents" class="view">
    <div class="card">
      <strong style="font-size:15px;">新增幼兒寶貝</strong>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input id="studentName" placeholder="輸入幼兒姓名 (例：小明)">
        <button class="primary" onclick="addStudent()">新增</button>
      </div>
    </div>

    <div id="manageStudentList"></div>
  </div>

  <!-- VIEW 3: CLASS SETTINGS & DATA -->
  <div id="viewSettings" class="view">
    <div class="card">
      <strong style="font-size:15px;">班級與目標張數設定</strong>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:10px;">
        <div>
          <label>班級名稱</label>
          <input id="className" placeholder="例如：櫻桃班 🌸" onchange="saveSettings()">
        </div>
        <div>
          <label>每人目標拍攝張數</label>
          <input id="targetPhotos" type="number" min="1" value="3" onchange="saveSettings()">
        </div>
      </div>
    </div>

    <div class="card">
      <strong style="font-size:15px;">批次資料管理</strong>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
        <input type="file" id="csvFileInput" accept=".csv, .txt" style="display:none" onchange="importCSV(event)">
        <button onclick="document.getElementById('csvFileInput').click()">📥 批次匯入學生名單 (CSV/TXT)</button>
        <button class="share-btn" onclick="exportCSV()">📤 匯出統計報表 (CSV)</button>
      </div>
    </div>

    <div class="card">
      <strong style="color:var(--danger); font-size:15px;">重置區域</strong>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
        <button class="danger" onclick="resetToday()">↩ 重置今日拍攝照片</button>
        <button class="danger" onclick="clearStudents()">🗑️ 清除所有學生與相冊</button>
      </div>
    </div>
  </div>
</div>

<!-- HIDDEN INPUTS FOR AVATAR & ENROLLMENT -->
<input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarSelected(event)">
<input type="file" id="enrollInput" accept="image/*" style="display:none" onchange="handleEnrollPhoto(event)">

<!-- BOTTOM NAVIGATION BAR -->
<div class="nav-bar">
  <button class="nav-item active" onclick="switchTab('camera', this)">
    <span class="icon">📸</span>
    <span>拍照歸類</span>
  </button>
  <button class="nav-item" onclick="switchTab('students', this)">
    <span class="icon">👶</span>
    <span>幼兒名單</span>
  </button>
  <button class="nav-item" onclick="switchTab('settings', this)">
    <span class="icon">⚙️</span>
    <span>班級設定</span>
  </button>
</div>

<!-- AI MULTI-STUDENT CLASSIFICATION ASSIGNMENT MODAL -->
<div class="modal-overlay" id="assignModal">
  <div class="modal-content">
    <h3 style="margin-top:0; margin-bottom:4px; font-size:18px; color:var(--text-main);">📸 選擇照片登場的幼兒 (可多選)</h3>
    <div style="font-size:12px; color:var(--text-muted);" id="capturedPreviewText">請勾選這張照片裡的所有幼兒寶貝：</div>
    
    <div class="assign-grid" id="assignGrid"></div>

    <div style="display:flex; gap:10px; margin-top:18px;">
      <button style="flex:1; padding:12px; background:#f1f5f9;" onclick="closeModal()">取消</button>
      <button style="flex:2; padding:12px;" class="primary" onclick="confirmMultiAssign()">💖 確認歸類照片</button>
    </div>
  </div>
</div>

<script>
// --- IndexedDB Database Setup ---
const db = new Dexie("KindergartenPhotoDB_v3");
db.version(1).stores({
  settings: "key",
  students: "++id, name",
  photos: "++id, studentId, timestamp"
});

let settings = { className: "", targetPhotos: 3 };
let students = [];
let tempCapturedBlob = null;
let currentTargetStudentId = null;
let selectedStudentIds = new Set();
let isAiReady = false;
let faceMatcher = null;
let filter = "all";

// --- App Initialization ---
async function initApp() {
  await loadSettings();
  await loadStudents();
  render();
  initAI();
}

async function loadSettings() {
  const savedClass = await db.settings.get("className");
  const savedTarget = await db.settings.get("targetPhotos");
  if (savedClass) settings.className = savedClass.value;
  if (savedTarget) settings.targetPhotos = savedTarget.value;
}

async function saveSettings() {
  const cName = document.getElementById("className").value.trim();
  const tPhotos = parseInt(document.getElementById("targetPhotos").value, 10) || 3;
  
  settings.className = cName;
  settings.targetPhotos = tPhotos;

  await db.settings.put({ key: "className", value: cName });
  await db.settings.put({ key: "targetPhotos", value: tPhotos });
  render();
}

async function loadStudents() {
  students = await db.students.toArray();
  for (let s of students) {
    s.photosCount = await db.photos.where("studentId").equals(s.id).count();
  }
}

// --- Tab Navigation ---
function switchTab(tabName, element) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  if (tabName === 'camera') document.getElementById('viewCamera').classList.add('active');
  if (tabName === 'students') document.getElementById('viewStudents').classList.add('active');
  if (tabName === 'settings') document.getElementById('viewSettings').classList.add('active');

  element.classList.add('active');
}

// --- AI Initialization ---
async function initAI() {
  const statusDiv = document.getElementById("aiStatus");
  try {
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark64Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    isAiReady = true;
    statusDiv.className = "ai-status ready";
    statusDiv.textContent = "✨ AI 人臉辨識模組隨時準備好運作囉！";
    rebuildFaceMatcher();
  } catch (err) {
    statusDiv.className = "ai-status";
    statusDiv.style.background = "#ffe4e6";
    statusDiv.style.color = "#e11d48";
    statusDiv.textContent = "⚠️ AI 模組載入失敗，採用手動歸類模式。";
  }
}

function rebuildFaceMatcher() {
  if (!isAiReady) return;
  const labeledDescriptors = [];
  students.forEach((s) => {
    if (s.descriptor && s.descriptor.length === 128) {
      const desc = new Float32Array(s.descriptor);
      labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(String(s.id), [desc]));
    }
  });

  if (labeledDescriptors.length > 0) {
    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
  } else {
    faceMatcher = null;
  }
}

// --- Avatar Setup ---
function triggerAvatarSelect(studentId) {
  currentTargetStudentId = studentId;
  document.getElementById("avatarInput").click();
}

async function handleAvatarSelected(e) {
  const file = e.target.files[0];
  if (!file || !currentTargetStudentId) return;

  await db.students.update(currentTargetStudentId, { avatarBlob: file });
  await loadStudents();
  render();
  e.target.value = "";
  currentTargetStudentId = null;
}

// --- Camera & Photo Capturing ---
function triggerCamera() {
  if (!students.length) {
    alert("請先新增幼兒寶貝名單，再進行拍照！");
    return;
  }
  document.getElementById("cameraInput").click();
}

async function handlePhotoCaptured(e) {
  const file = e.target.files[0];
  if (!file) return;

  tempCapturedBlob = file; 
  selectedStudentIds.clear();

  let autoMatchedIds = [];

  // Multi-face Detection using face-api
  if (isAiReady && faceMatcher) {
    const img = await faceapi.bufferToImage(file);
    const detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks()
      .withFaceDescriptors();

    detections.forEach(det => {
      const match = faceMatcher.findBestMatch(det.descriptor);
      if (match.label !== 'unknown') {
        const id = parseInt(match.label, 10);
        autoMatchedIds.push(id);
        selectedStudentIds.add(id);
      }
    });
  }

  openAssignModal(autoMatchedIds);
  e.target.value = "";
}

function openAssignModal(autoMatchedIds = []) {
  const modal = document.getElementById("assignModal");
  const target = settings.targetPhotos || 3;
  const previewText = document.getElementById("capturedPreviewText");

  if (autoMatchedIds.length > 0) {
    previewText.innerHTML = `✨ <strong style="color:var(--primary-dark);">AI 自動偵測出 ${autoMatchedIds.length} 位幼兒！可調整勾選：</strong>`;
  } else {
    previewText.textContent = "請勾選照片中登場的所有幼兒寶貝：";
  }

  renderAssignGrid();
  modal.classList.add("active");
}

function renderAssignGrid() {
  const grid = document.getElementById("assignGrid");
  const target = settings.targetPhotos || 3;

  grid.innerHTML = students.map(s => {
    const photos = s.photosCount || 0;
    const isUnder = photos < target;
    const isSelected = selectedStudentIds.has(s.id);
    const avatarUrl = s.avatarBlob ? URL.createObjectURL(s.avatarBlob) : '';

    return `
      <div class="assign-card ${isSelected ? 'selected' : ''}" onclick="toggleSelectStudent(${s.id})">
        <div class="checkbox-badge">${isSelected ? '✓' : ''}</div>
        <div class="avatar avatar-sm">
          ${avatarUrl ? `<img src="${avatarUrl}">` : '👶'}
        </div>
        <div style="font-weight:800; font-size:14px; ${isSelected ? 'color:var(--primary-dark);' : ''}">${escapeHtml(s.name)}</div>
        <div class="count" style="${isUnder ? 'color:var(--danger);font-weight:bold;' : ''}">
          進度: ${photos} / ${target} 張
        </div>
      </div>
    `;
  }).join("");
}

function toggleSelectStudent(studentId) {
  if (selectedStudentIds.has(studentId)) {
    selectedStudentIds.delete(studentId);
  } else {
    selectedStudentIds.add(studentId);
  }
  renderAssignGrid();
}

function closeModal() {
  document.getElementById("assignModal").classList.remove("active");
  tempCapturedBlob = null;
  selectedStudentIds.clear();
}

async function confirmMultiAssign() {
  if (selectedStudentIds.size === 0) {
    if (!confirm("您尚未勾選任何幼兒，確定不上傳這張照片嗎？")) return;
    closeModal();
    return;
  }

  if (tempCapturedBlob) {
    const now = new Date().getTime();
    for (let id of selectedStudentIds) {
      await db.photos.add({
        studentId: id,
        blob: tempCapturedBlob,
        timestamp: now
      });
    }
    await loadStudents();
    render();
  }
  closeModal();
}

// --- AI Enrollment ---
function triggerEnroll(studentId) {
  currentTargetStudentId = studentId;
  document.getElementById("enrollInput").click();
}

async function handleEnrollPhoto(e) {
  const file = e.target.files[0];
  if (!file || !currentTargetStudentId) return;

  const statusDiv = document.getElementById("aiStatus");
  statusDiv.textContent = "🔄 正在提取小寶貝的人臉特徵...";

  const img = await faceapi.bufferToImage(file);
  const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!detection) {
    alert("⚠️ 未能清晰偵測到臉部特徵，請選擇清晰正面照片。");
  } else {
    const descriptorArray = Array.from(detection.descriptor);
    const student = students.find(s => s.id === currentTargetStudentId);
    let updateObj = { descriptor: descriptorArray };
    if (!student.avatarBlob) updateObj.avatarBlob = file;

    await db.students.update(currentTargetStudentId, updateObj);
    await loadStudents();
    rebuildFaceMatcher();
    render();
    alert("成功錄入 AI 人臉特徵！");
  }

  statusDiv.textContent = "✨ AI 人臉辨識模組隨時準備好運作囉！";
  e.target.value = "";
  currentTargetStudentId = null;
}

// --- Sharing Photos ---
async function shareStudentPhotos(studentId) {
  const student = students.find(s => s.id === studentId);
  const photoRecords = await db.photos.where("studentId").equals(studentId).toArray();
  const validBlobs = photoRecords.filter(p => p.blob).map(p => p.blob);

  if (validBlobs.length === 0) {
    alert(`目前沒有 ${student.name} 的照片可供傳送！`);
    return;
  }

  const files = validBlobs.map((blob, index) => {
    return new File([blob], `${student.name}_photo_${index + 1}.jpg`, { type: blob.type || "image/jpeg" });
  });

  if (navigator.canShare && navigator.canShare({ files: files })) {
    try {
      await navigator.share({
        title: `${student.name} 的今日園所照片 🌸`,
        text: `家長您好！這是 ${student.name} 今天在學校的精彩照片 📸💖`,
        files: files
      });
    } catch (err) {
      if (err.name !== 'AbortError') downloadFiles(files);
    }
  } else {
    downloadFiles(files);
  }
}

function downloadFiles(files) {
  files.forEach(file => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = file.name;
    a.click();
  });
}

// --- List Management ---
async function addStudent() {
  const input = document.getElementById("studentName");
  const name = input.value.trim();
  if (!name) return;
  if (students.some(s => s.name === name)) {
    alert("已存在相同姓名的幼兒！");
    return;
  }
  await db.students.add({ name: name, descriptor: null, avatarBlob: null });
  input.value = "";
  await loadStudents();
  rebuildFaceMatcher();
  render();
}

async function addPhoto(studentId) {
  await db.photos.add({ studentId: studentId, blob: null, timestamp: new Date().getTime() });
  await loadStudents();
  render();
}

async function removePhoto(studentId) {
  const lastPhoto = await db.photos.where("studentId").equals(studentId).last();
  if (lastPhoto) {
    await db.photos.delete(lastPhoto.id);
    await loadStudents();
    render();
  }
}

async function deleteStudent(studentId) {
  const student = students.find(s => s.id === studentId);
  if (!confirm(`確定要刪除「${student.name}」的所有資料嗎？`)) return;
  await db.students.delete(studentId);
  await db.photos.where("studentId").equals(studentId).delete();
  await loadStudents();
  rebuildFaceMatcher();
  render();
}

async function resetToday() {
  if (!confirm("確定要清空今天的照片紀錄嗎？")) return;
  await db.photos.clear();
  await loadStudents();
  render();
}

async function clearStudents() {
  if (!confirm("確定要刪除所有學生與相冊記錄嗎？")) return;
  await db.students.clear();
  await db.photos.clear();
  await loadStudents();
  rebuildFaceMatcher();
  render();
}

function setFilter(val) {
  filter = val;
  document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById(val + "Btn");
  if (btn) btn.classList.add("active");
  renderCameraStudentList();
}

// --- Import / Export CSV ---
async function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(evt) {
    const lines = evt.target.result.split(/[\r\n,]+/);
    let count = 0;
    for (let line of lines) {
      const name = line.trim();
      if (name && name !== "姓名" && name !== "Name" && !students.some(s => s.name === name)) {
        await db.students.add({ name: name, descriptor: null, avatarBlob: null });
        count++;
      }
    }
    await loadStudents();
    rebuildFaceMatcher();
    render();
    alert(`成功匯入 ${count} 位幼兒寶貝！`);
    e.target.value = "";
  };
  reader.readAsText(file, "UTF-8");
}

function exportCSV() {
  if (!students.length) return alert("目前沒有幼兒資料。");
  const target = settings.targetPhotos || 3;
  let csvContent = "\uFEFF姓名,拍攝張數,是否達標\n";
  students.forEach(s => {
    const isDone = (s.photosCount || 0) >= target ? "是" : "否";
    csvContent += `"${s.name}",${s.photosCount || 0},"${isDone}"\n`;
  });

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${settings.className || '班級'}_拍照統計表.csv`;
  link.click();
}

// --- Rendering Logic ---
function render() {
  document.getElementById("className").value = settings.className || "";
  document.getElementById("targetPhotos").value = settings.targetPhotos || 3;
  document.getElementById("headerSubText").textContent = `${settings.className || "未設定班級"} 🌸 目標 ${settings.targetPhotos || 3} 張/人`;

  const total = students.length;
  const target = settings.targetPhotos || 3;
  
  const doneCount = students.filter(s => (s.photosCount || 0) >= target).length;
  const underTargetCount = students.filter(s => (s.photosCount || 0) < target).length;
  const photoTotal = students.reduce((sum, s) => sum + (s.photosCount || 0), 0);
  
  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  const avg = total ? (photoTotal / total).toFixed(1) : "0";

  document.getElementById("progressText").textContent = `已達標 ${doneCount} / ${total} 人`;
  document.getElementById("photoTotal").textContent = photoTotal;
  document.getElementById("averagePhotos").textContent = avg;
  document.getElementById("percent").textContent = `${pct}%`;
  document.getElementById("underTargetCount").textContent = underTargetCount;
  document.getElementById("bar").style.width = `${pct}%`;

  renderCameraStudentList();
  renderManageStudentList();
}

async function renderCameraStudentList() {
  const box = document.getElementById("cameraStudentList");
  const target = settings.targetPhotos || 3;
  let list = [...students];

  if (filter === "todo") list = list.filter(s => (s.photosCount || 0) === 0);
  if (filter === "under") list = list.filter(s => (s.photosCount || 0) < target);
  if (filter === "done") list = list.filter(s => (s.photosCount || 0) >= target);

  if (!list.length) {
    box.innerHTML = '<div class="empty">沒有符合條件的幼兒寶貝 🌸</div>';
    return;
  }

  box.innerHTML = "";

  for (let s of list) {
    const photos = s.photosCount || 0;
    const isDone = photos >= target;
    const avatarUrl = s.avatarBlob ? URL.createObjectURL(s.avatarBlob) : '';

    const photoRecords = await db.photos.where("studentId").equals(s.id).toArray();
    let thumbsHtml = '';
    if (photoRecords.length > 0) {
      thumbsHtml = '<div class="photo-thumbs">';
      for (let p of photoRecords) {
        if (p.blob) {
          thumbsHtml += `<img src="${URL.createObjectURL(p.blob)}" class="thumb">`;
        }
      }
      thumbsHtml += '</div>';
    }

    const card = document.createElement("div");
    card.className = `student-card ${isDone ? "done" : "alert-target"}`;
    card.innerHTML = `
      <div class="student-header">
        <div class="avatar" onclick="triggerAvatarSelect(${s.id})">
          ${avatarUrl ? `<img src="${avatarUrl}">` : '👶'}
        </div>
        <div class="student-info">
          <div class="student-name">
            ${escapeHtml(s.name)}
            ${photos >= target ? '<span class="badge badge-success">已達標 ✨</span>' : `<span class="badge badge-warning">還差 ${target - photos} 張</span>`}
          </div>
          <div class="student-sub">目前拍攝：${photos} / ${target} 張</div>
          ${thumbsHtml}
        </div>
      </div>
      <div class="student-actions">
        <button class="share-btn" onclick="shareStudentPhotos(${s.id})">📤 傳送照片</button>
        <div style="display:flex; align-items:center; gap:4px;">
          <button onclick="removePhoto(${s.id})" ${photos === 0 ? 'disabled' : ''}>−1</button>
          <button class="primary" onclick="addPhoto(${s.id})">＋1</button>
        </div>
      </div>
    `;
    box.appendChild(card);
  }
}

async function renderManageStudentList() {
  const box = document.getElementById("manageStudentList");
  if (!students.length) {
    box.innerHTML = '<div class="empty">目前尚無幼兒資料，請點擊上方新增 🌸</div>';
    return;
  }

  box.innerHTML = "";
  for (let s of students) {
    const avatarUrl = s.avatarBlob ? URL.createObjectURL(s.avatarBlob) : '';
    const hasDescriptor = s.descriptor && s.descriptor.length === 128;

    const card = document.createElement("div");
    card.className = "student-card";
    card.innerHTML = `
      <div class="student-header">
        <div class="avatar" onclick="triggerAvatarSelect(${s.id})">
          ${avatarUrl ? `<img src="${avatarUrl}">` : '📷'}
        </div>
        <div class="student-info">
          <div class="student-name">
            ${escapeHtml(s.name)}
            ${hasDescriptor ? '<span class="badge badge-ai">🤖 AI已錄入</span>' : ''}
          </div>
          <div class="student-sub">點擊大頭照圖示可設定頭像</div>
        </div>
      </div>
      <div class="student-actions">
        <button onclick="triggerAvatarSelect(${s.id})">🖼️ 設定頭像</button>
        <button onclick="triggerEnroll(${s.id})">🤖 人臉特徵</button>
        <button class="danger" onclick="deleteStudent(${s.id})">刪除</button>
      </div>
    `;
    box.appendChild(card);
  }
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// Service Worker Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  });
}

document.getElementById("studentName").addEventListener("keydown", e => { if (e.key === "Enter") addStudent(); });
window.addEventListener('DOMContentLoaded', initApp);
</script>
